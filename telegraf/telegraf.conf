[global_tags]
  environment = "development"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  omit_hostname = false

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  client_id = "telegraf-iot-logs"
  qos = 0
  connection_timeout = "30s"
  persistent_session = false
  topics = [
    "devices/+/logs"
  ]
  data_format = "json"
  name_override = "device_log"
  tag_keys = ["level"]
  json_string_fields = ["message"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "devices/+/logs"
    measurement = "_/_/_"
    tags = "_/device_id/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "device-manager-token"
  organization = "iot"
  bucket = "device_logs"
  timeout = "5s"
