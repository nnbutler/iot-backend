# Listener on standard MQTT port
listener 1883

# Dev: allow anonymous connections within the Docker network.
# Production: set allow_anonymous false and enable password_file + TLS.
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type information
log_type subscribe
log_type unsubscribe
