services:
  postgres:
    image: postgres:15-alpine
    container_name: iot-backend-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-device_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-device_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: iot-backend-api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: iot-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"
    depends_on:
      - backend
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t '$$health' -m ping -q 0 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    container_name: iot-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: iot
      DOCKER_INFLUXDB_INIT_BUCKET: device_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: device-manager-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "influx ping --host http://localhost:8086 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    container_name: iot-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    environment:
      INFLUXDB_TOKEN: device-manager-token
      INFLUXDB_ORG: iot
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: iot-nginx
    ports:
      - "8080:80"      # HTTP (redirects to HTTPS)
      - "8443:443"     # HTTPS (dev: self-signed; prod: Let's Encrypt)
    volumes:
      - ./nginx/certs:/etc/nginx/certs
      - ./certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: iot-postgres-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-device_manager}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  influxdb-backup:
    image: influxdb:2.7-alpine
    container_name: iot-influxdb-backup
    environment:
      INFLUXDB_TOKEN: device-manager-token
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups/influxdb:/backups
      - ./scripts/influx-backup.sh:/influx-backup.sh:ro
    entrypoint: >
      /bin/sh -c "
        echo '0 2 * * * /bin/sh /influx-backup.sh >> /var/log/influx-backup.log 2>&1' | crontab - &&
        crond -f -l 8
      "
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
  influxdb_data:
